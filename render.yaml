# One-click deploy on Render (free plan): https://render.com/deploy
services:
  - type: web
    name: dhriti
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: ADMIN_TOKEN
        generateValue: true
      # Optional: connect any OpenAI-compatible model (Groq, OpenRouter, Together, ...).
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
